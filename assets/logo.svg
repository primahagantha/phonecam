<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <!-- Card Border Highlight -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Phone Chassis Gradient -->
    <linearGradient id="phone-chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Phone Glass Screen Gradient -->
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131D31"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>

    <!-- Lens Bezel Metallic Gradient -->
    <linearGradient id="lens-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="35%" stop-color="#1E293B"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Camera Lens Optical Elements -->
    <radialGradient id="lens-glass" cx="42%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#0284C7"/>
      <stop offset="65%" stop-color="#2563EB"/>
      <stop offset="90%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </radialGradient>

    <radialGradient id="lens-iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#0EA5E9"/>
      <stop offset="75%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Wireless Waves Gradient -->
    <linearGradient id="wave-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Live Tally Light Accent Gradient -->
    <radialGradient id="tally-grad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="70%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </radialGradient>

    <!-- Drop Shadows and Glows -->
    <filter id="card-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="phone-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="wave-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="tally-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad)" stroke="url(#card-border)" stroke-width="2.5" filter="url(#card-shadow)"/>

  <!-- Phone Body Outline & Screen -->
  <g id="phone-body" filter="url(#phone-shadow)">
    <!-- Chassis Outer Shell -->
    <rect x="146" y="80" width="220" height="352" rx="42" fill="url(#phone-chassis)" stroke="#334155" stroke-width="2.5"/>
    <!-- Screen Glass Inset -->
    <rect x="156" y="90" width="200" height="332" rx="34" fill="url(#screen-grad)" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Top Speaker Ear-piece -->
    <rect x="228" y="104" width="56" height="5" rx="2.5" fill="#334155"/>
    <!-- Home Bar Indicator -->
    <rect x="216" y="406" width="80" height="4" rx="2" fill="#334155" opacity="0.8"/>
  </g>

  <!-- Main Camera Studio Lens -->
  <g id="camera-lens">
    <!-- Outer Heavy Lens Ring / Housing -->
    <circle cx="256" cy="242" r="92" fill="url(#lens-bezel)" stroke="#475569" stroke-width="2"/>
    <circle cx="256" cy="242" r="82" fill="#0A0F1D" stroke="#1E293B" stroke-width="3"/>

    <!-- Optical Lens Glass Body -->
    <circle cx="256" cy="242" r="72" fill="url(#lens-glass)"/>

    <!-- Concentric Aperture Guides -->
    <circle cx="256" cy="242" r="54" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="4 3"/>
    
    <!-- Inner Lens Core / Iris -->
    <circle cx="256" cy="242" r="44" fill="url(#lens-iris)"/>
    <!-- Dark Sensor Pupil -->
    <circle cx="256" cy="242" r="24" fill="#030712" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="256" cy="242" r="10" fill="#0284C7" opacity="0.7"/>

    <!-- Glass Highlights / Specular Glare -->
    <path d="M 204 200 A 72 72 0 0 1 296 182 A 62 62 0 0 0 216 226 Z" fill="#FFFFFF" fill-opacity="0.22"/>
    <ellipse cx="232" cy="214" rx="14" ry="7" transform="rotate(-35 232 214)" fill="#FFFFFF" fill-opacity="0.38"/>
    <circle cx="282" cy="276" r="4" fill="#38BDF8" fill-opacity="0.6"/>
  </g>

  <!-- Wireless Broadcast Waves -->
  <g id="wireless-waves" filter="url(#wave-glow)">
    <!-- Wave 1 (Inner) -->
    <path d="M 330 178 A 78 78 0 0 1 386 234" fill="none" stroke="url(#wave-grad)" stroke-width="7" stroke-linecap="round"/>
    <!-- Wave 2 (Middle) -->
    <path d="M 352 152 A 112 112 0 0 1 432 232" fill="none" stroke="url(#wave-grad)" stroke-width="7" stroke-linecap="round" stroke-opacity="0.85"/>
    <!-- Wave 3 (Outer) -->
    <path d="M 374 126 A 146 146 0 0 1 478 230" fill="none" stroke="url(#wave-grad)" stroke-width="7" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>

  <!-- Live Studio Streaming Indicator (Tally Light) -->
  <g id="tally-indicator" filter="url(#tally-glow)">
    <circle cx="334" cy="120" r="11" fill="url(#tally-grad)"/>
    <circle cx="334" cy="120" r="4.5" fill="#FFE4E6"/>
  </g>
</svg>
