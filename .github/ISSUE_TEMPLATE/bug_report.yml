name: "🐛 Bug Report"
description: "File a bug report to help us improve PhoneCam"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible so we can reproduce and fix the problem.

  - type: input
    id: version
    attributes:
      label: PhoneCam Desktop Version
      description: What version of PhoneCam are you running? (e.g., v1.0.0, Git commit hash)
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you running the PhoneCam desktop app on?
      options:
        - Windows 11
        - Windows 10
        - Linux (Ubuntu / Debian / Fedora / Arch)
        - macOS
    validations:
      required: true

  - type: input
    id: phone_info
    attributes:
      label: Phone Model & Android Version
      description: What Android device and OS version is the PhoneCam camera app running on?
      placeholder: "e.g. Google Pixel 7 (Android 14) / Samsung Galaxy S23 (One UI 6.0)"
    validations:
      required: true

  - type: dropdown
    id: connection_mode
    attributes:
      label: Connection Mode
      description: How is the phone connected to your PC?
      options:
        - USB (ADB port forwarding)
        - Wi-Fi (Direct TCP / Discovery)
        - Both / Tested both
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what went wrong.
      placeholder: "Describe what happened..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Open PhoneCam desktop app
        2. Launch PhoneCam on Android device
        3. Connect via USB / Wi-Fi
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "Camera stream should connect smoothly without dropping frames..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Diagnostics Output
      description: |
        Paste relevant log entries from the PhoneCam Diagnostics panel or log file (`%LOCALAPPDATA%\PhoneCam\logs\phonecam.log` or `adb logcat`).
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have tested with the latest release or build.
          required: false
