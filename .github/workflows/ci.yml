name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR commits against Conventional Commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

  rust-matrix:
    name: Rust CI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            target: windows
          - os: ubuntu-latest
            name: Ubuntu Linux
            target: linux
          - os: macos-latest
            name: macOS
            target: macos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libxcb1-dev \
            libx11-xcb-dev \
            libvulkan-dev \
            libwayland-dev \
            libssl-dev \
            pkg-config

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-ci-${{ matrix.target }}"

      # Windows-latest (x64): cargo test --workspace, clippy, check
      - name: Cargo check workspace (Windows)
        if: matrix.target == 'windows'
        run: cargo check --workspace

      - name: Cargo clippy workspace (Windows)
        if: matrix.target == 'windows'
        run: cargo clippy --workspace

      - name: Cargo test workspace (Windows)
        if: matrix.target == 'windows'
        run: cargo test --workspace

      # Ubuntu-latest: cargo test for core/media/protocol/android-core
      - name: Cargo test core, media, protocol, android-core (Ubuntu)
        if: matrix.target == 'linux'
        run: cargo test -p phonecam-core -p phonecam-media -p phonecam-protocol -p phonecam-android-core

      # macOS-latest: cargo test for core/media/protocol
      - name: Cargo test core, media, protocol (macOS)
        if: matrix.target == 'macos'
        run: cargo test -p phonecam-core -p phonecam-media -p phonecam-protocol

  android-ci:
    name: Android CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-android-ci"

      - name: Build phonecam-android-core host library for JVM unit tests
        run: cargo build -p phonecam-android-core --release

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew

      - name: Run Android unit tests
        working-directory: apps/android
        run: ./gradlew test --stacktrace

      - name: Assemble Android Release APK
        working-directory: apps/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Android test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: apps/android/app/build/reports/tests/

      - name: Upload Android APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-apks
          path: apps/android/app/build/outputs/apk/release/*.apk
